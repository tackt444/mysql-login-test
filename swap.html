<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI顔変換 - メイン画面</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .upload-box {
            border: 2px dashed #cbd5e0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #fafafa;
            cursor: pointer;
        }
        .upload-box:hover {
            border-color: #4a5568;
        }
        input[type="file"] {
            display: none;
        }
        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 4px;
            display: none;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        #result-container {
            margin-top: 30px;
            display: none;
        }
        #result-img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .loading {
            display: none;
            margin: 20px 0;
            color: #4a5568;
            font-weight: bold;
        }
        .nav-links {
            margin-top: 20px;
        }
        .nav-links a {
            color: #4a5568;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI顔変換システム</h1>
    <p>入れ替えたい2枚の画像をアップロードしてください。</p>

    <form id="swap-form">
        <!-- 1枚目：ターゲット（体になる画像） -->
        <div class="upload-box" onclick="document.getElementById('target_image').click()">
            <p id="target-text">① ベースになる画像（体・元写真）を選択</p>
            <input type="file" id="target_image" name="target_image" accept="image/*" required onchange="previewFile('target_image', 'target-preview', 'target-text')">
            <img id="target-preview" class="preview-img" alt="ターゲットプレビュー">
        </div>

        <!-- 2枚目：ソース（顔を持ってくる画像） -->
        <div class="upload-box" onclick="document.getElementById('source_image').click()">
            <p id="source-text">② はめ込みたい顔画像を選択</p>
            <input type="file" id="source_image" name="source_image" accept="image/*" required onchange="previewFile('source_image', 'source-preview', 'source-text')">
            <img id="source-preview" class="preview-img" alt="ソースプレビュー">
        </div>

        <button type="submit">顔変換を実行する</button>
    </form>

    <div class="loading" id="loading-text">AIが顔を変換しています... (15秒〜30秒ほどかかります)</div>

    <!-- 変換結果の表示エリア -->
    <div id="result-container">
        <h3>✨ 変換結果 ✨</h3>
        <img id="result-img" src="" alt="変換後の画像">
    </div>

    <div class="nav-links">
        <a href="legal.html">利用規約・プライバシーポリシー</a>
    </div>
</div>

<script>
    // 画像を選択したときに画面にミニプレビューを表示する機能
    function previewFile(inputId, previewId, textId) {
        const file = document.getElementById(inputId).files[0];
        const preview = document.getElementById(previewId);
        const text = document.getElementById(textId);
        const reader = new FileReader();

        reader.addEventListener("load", function () {
            preview.src = reader.result;
            preview.style.display = "block";
            text.style.display = "none";
        }, false);

        if (file) {
            reader.readAsDataURL(file);
        }
    }

    // 「顔変換を実行する」ボタンを押したときの処理
    document.getElementById('swap-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        // 🛠️ 【修正】正しくファイルデータをバックエンドに送るための記述に直しました
        const targetFile = document.getElementById('target_image').files[0];
        const sourceFile = document.getElementById('source_image').files[0];

        const formData = new FormData();
        formData.append('target_image', targetFile);
        formData.append('source_image', sourceFile);

        // 画面の表示を切り替える（ローディングを出す）
        document.getElementById('loading-text').style.display = 'block';
        document.getElementById('result-container').style.display = 'none';

        try {
            // 🛠️ 【修正】現在のページURL（/swap-page）からでも正しく届くよう、通信先を固定しました
            const response = await fetch('http://127.0.0', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || '変換エラーが発生しました。');
            }

            const data = await response.json();

            // AIから返ってきた画像のURLを画面に表示する
            document.getElementById('result-img').src = data.result_url;
            document.getElementById('result-container').style.display = 'block';
        } catch (error) {
            alert('エラーが発生しました: ' + error.message);
        } finally {
            // ローディングを消す
            document.getElementById('loading-text').style.display = 'none';
        }
    });
</script>

</body>
</html>
